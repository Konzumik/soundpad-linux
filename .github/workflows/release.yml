name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # Oldest supported Ubuntu → the binary runs on older glibc too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - name: Package
        run: |
          name="soundpad-linux-${GITHUB_REF_NAME#v}-x86_64"
          mkdir "$name"
          cp target/release/soundpad soundpad.desktop install.sh README.md README.ru.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            soundpad-linux-*.tar.gz
            soundpad-linux-*.tar.gz.sha256
          generate_release_notes: true
