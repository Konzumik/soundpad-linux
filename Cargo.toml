[package]
name = "soundpad"
version = "0.2.0"
edition = "2021"
description = "Soundboard for Linux (PipeWire/PulseAudio) with a virtual microphone"
license = "MIT"
repository = "https://github.com/Konzumik/soundpad-linux"

[dependencies]
eframe = "0.31"
symphonia = { version = "0.5", features = ["all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
ctrlc = { version = "3", features = ["termination"] }
rfd = "0.15"
evdev = "0.13.2"
ksni = { version = "0.3.6", features = ["blocking"] }
nnnoiseless = { version = "0.5.2", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
